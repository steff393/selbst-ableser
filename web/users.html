<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<title>Benutzerverwaltung</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style>
		:root {
			--color-primary: #0d7377;
			--color-primary-light: #14a3a8;
			--color-primary-dark: #0a5254;
			--color-accent: #f4a259;
			--color-success: #52b788;
			--color-danger: #e63946;
			--color-admin: #9b59b6;
			
			--color-bg: #f8f9fb;
			--color-surface: #ffffff;
			--color-surface-hover: #f5f7fa;
			
			--color-text-primary: #1a2332;
			--color-text-secondary: #5a6a7f;
			--color-text-muted: #8493a8;
			--color-border: #e3e8ef;
			--color-border-light: #f0f3f7;
			
			--shadow-sm: 0 1px 3px rgba(13, 115, 119, 0.04), 0 1px 2px rgba(13, 115, 119, 0.02);
			--shadow-md: 0 4px 6px rgba(13, 115, 119, 0.06), 0 2px 4px rgba(13, 115, 119, 0.04);
			--shadow-lg: 0 10px 15px rgba(13, 115, 119, 0.08), 0 4px 6px rgba(13, 115, 119, 0.04);
			
			--radius-sm: 8px;
			--radius-md: 12px;
			--radius-lg: 16px;
			
			--transition-fast: 100ms cubic-bezier(0.4, 0, 0.2, 1);
			--transition-base: 150ms cubic-bezier(0.4, 0, 0.2, 1);
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: linear-gradient(135deg, #f8f9fb 0%, #eef2f7 100%);
			color: var(--color-text-primary);
			line-height: 1.6;
			min-height: 100vh;
			padding: 1rem;
		}

		.container {
			max-width: 1200px;
			margin: 0 auto;
		}

		.header {
			text-align: center;
			margin-bottom: 1rem;
			padding: 1rem;
			background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
			border-radius: var(--radius-lg);
			box-shadow: var(--shadow-lg);
			color: white;
			position: relative;
			overflow: hidden;
		}

		.header::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
			opacity: 0.4;
		}

		.header h1 {
			font-size: clamp(1.5rem, 4vw, 2rem);
			font-weight: 700;
			position: relative;
		}

		.header .subtitle {
			font-size: 0.9rem;
			opacity: 0.95;
			font-weight: 300;
			position: relative;
			margin-top: 0.25rem;
		}

		.actions-bar {
			background: var(--color-surface);
			border-radius: var(--radius-lg);
			padding: 0.75rem 1rem;
			margin-bottom: 1rem;
			box-shadow: var(--shadow-md);
			display: flex;
			gap: 0.75rem;
			flex-wrap: wrap;
		}

		.btn {
			padding: 0.5rem 1rem;
			border: none;
			border-radius: var(--radius-sm);
			font-size: 0.95rem;
			font-weight: 500;
			cursor: pointer;
			transition: all var(--transition-base);
			display: inline-flex;
			align-items: center;
			gap: 0.5rem;
		}

		.btn-primary {
			background: var(--color-primary);
			color: white;
		}

		.btn-primary:hover {
			background: var(--color-primary-dark);
			transform: translateY(-1px);
			box-shadow: var(--shadow-sm);
		}

		.btn-success {
			background: var(--color-success);
			color: white;
		}

		.btn-success:hover {
			background: #3d9970;
			transform: translateY(-1px);
			box-shadow: var(--shadow-sm);
		}

		.btn-secondary {
			background: var(--color-text-muted);
			color: white;
		}

		.btn-secondary:hover {
			background: var(--color-text-secondary);
			transform: translateY(-1px);
			box-shadow: var(--shadow-sm);
		}

		.btn-danger {
			background: transparent;
			border: 1px solid var(--color-danger);
			color: var(--color-danger);
			padding: 0.35rem 0.75rem;
			font-size: 0.85rem;
		}

		.btn-danger:hover {
			background: var(--color-danger);
			color: white;
		}

		.btn-link {
			background: transparent;
			border: 1px solid var(--color-primary);
			color: var(--color-primary);
			padding: 0.35rem 0.75rem;
			font-size: 0.85rem;
		}

		.btn-link:hover {
			background: var(--color-primary);
			color: white;
		}

		.table-card {
			background: var(--color-surface);
			border-radius: var(--radius-lg);
			overflow: hidden;
			box-shadow: var(--shadow-md);
			margin-bottom: 1rem;
		}

		.table-wrapper {
			overflow-x: auto;
		}

		table {
			width: 100%;
			border-collapse: separate;
			border-spacing: 0;
		}

		thead {
			background: linear-gradient(to right, var(--color-bg), var(--color-surface));
			position: sticky;
			top: 0;
			z-index: 1;
		}

		th {
			padding: 0.75rem 0.5rem;
			text-align: left;
			font-size: 0.85rem;
			font-weight: 600;
			color: var(--color-text-secondary);
			text-transform: uppercase;
			letter-spacing: 0.5px;
			border-bottom: 2px solid var(--color-border);
		}

		td {
			padding: 0.75rem 0.5rem;
			border-bottom: 1px solid var(--color-border-light);
			font-size: 0.95rem;
			color: var(--color-text-primary);
		}

		tbody tr {
			transition: background var(--transition-fast);
		}

		tbody tr:hover {
			background: var(--color-surface-hover);
		}

		tbody tr:last-child td {
			border-bottom: none;
		}

		.token {
			font-family: 'Courier New', monospace;
			background: linear-gradient(135deg, rgba(13, 115, 119, 0.08) 0%, rgba(20, 163, 168, 0.05) 100%);
			padding: 0.25rem 0.5rem;
			border-radius: var(--radius-sm);
			font-size: 0.85rem;
			color: var(--color-primary-dark);
			display: inline-block;
			border: 1px solid rgba(13, 115, 119, 0.15);
		}

		.token.admin {
			background: linear-gradient(135deg, rgba(155, 89, 182, 0.15) 0%, rgba(155, 89, 182, 0.08) 100%);
			color: var(--color-admin);
			border: 1px solid rgba(155, 89, 182, 0.25);
			font-weight: 600;
		}

		input[type="text"],
		input[type="number"],
		input[type="date"] {
			width: 100%;
			padding: 0.4rem 0.5rem;
			border: 1px solid var(--color-border);
			border-radius: var(--radius-sm);
			font-size: 0.9rem;
			transition: all var(--transition-fast);
			background: white;
		}

		input:focus {
			outline: none;
			border-color: var(--color-primary);
			box-shadow: 0 0 0 3px rgba(13, 115, 119, 0.1);
		}

		input.error {
			background: rgba(230, 57, 70, 0.08);
			border-color: rgba(230, 57, 70, 0.3);
		}

		.flat-input.error {
			background: rgba(230, 57, 70, 0.08);
			border-color: rgba(230, 57, 70, 0.3);
		}

		.actions-cell {
			display: flex;
			gap: 0.5rem;
			flex-wrap: wrap;
		}

		.status-box {
			background: var(--color-surface);
			border-radius: var(--radius-lg);
			padding: 1rem;
			margin-top: 1rem;
			box-shadow: var(--shadow-md);
		}

		.status-box.success {
			border-left: 4px solid var(--color-success);
			background: linear-gradient(135deg, rgba(82, 183, 136, 0.08) 0%, rgba(82, 183, 136, 0.05) 100%);
		}

		.status-box.error {
			border-left: 4px solid var(--color-danger);
			background: linear-gradient(135deg, rgba(230, 57, 70, 0.08) 0%, rgba(230, 57, 70, 0.05) 100%);
		}

		.status-box code {
			font-family: 'Courier New', monospace;
			background: rgba(0, 0, 0, 0.05);
			padding: 0.25rem 0.5rem;
			border-radius: var(--radius-sm);
			font-size: 1.1em;
		}

		.status-box a {
			color: var(--color-primary);
			text-decoration: none;
			font-weight: 600;
		}

		.status-box a:hover {
			text-decoration: underline;
		}

		.empty-state {
			text-align: center;
			padding: 3rem 1rem;
			color: var(--color-text-muted);
		}

		.empty-state-icon {
			font-size: 3rem;
			margin-bottom: 1rem;
		}

		.total-area {
			background: var(--color-surface);
			border-radius: var(--radius-lg);
			padding: 1rem;
			box-shadow: var(--shadow-md);
			display: flex;
			justify-content: space-between;
			align-items: center;
			font-size: 1.1rem;
			font-weight: 600;
			color: var(--color-text-primary);
		}

		.total-area .value {
			color: var(--color-primary);
			font-size: 1.3rem;
		}

		@media (max-width: 768px) {
			.actions-bar {
				flex-direction: column;
			}

			.btn {
				width: 100%;
				justify-content: center;
			}

			th, td {
				padding: 0.5rem 0.3rem;
				font-size: 0.85rem;
			}

			input[type="text"],
			input[type="number"],
			input[type="date"] {
				font-size: 0.85rem;
				padding: 0.35rem 0.4rem;
			}

			.actions-cell {
				flex-direction: column;
			}

			.total-area {
				flex-direction: column;
				gap: 0.5rem;
				text-align: center;
			}
		}

		@media print {
			body {
				background: white;
				padding: 0;
			}

			.actions-bar,
			.btn {
				display: none;
			}

			.table-card {
				box-shadow: none;
			}

			.footer {
				display: none;
			}
		}

		.footer {
			text-align: center;
			color: var(--color-text-muted);
			font-size: 0.85rem;
			margin-top: 2rem;
			padding: 1.5rem 1rem;
			border-top: 1px solid var(--color-border-light);
		}

		.footer a {
			color: var(--color-text-secondary);
			margin: 0 0.75rem;
			text-decoration: none;
			transition: color var(--transition-base);
		}

		.footer a:hover {
			color: var(--color-primary);
			text-decoration: underline;
		}
	</style>
</head>
<body>

<div class="container">
	<div class="header">
		<h1>Benutzerverwaltung</h1>
		<div class="subtitle">Verwaltung von Benutzern, Wohnungen und Zugangsrechten</div>
	</div>

	<div class="actions-bar">
		<button class="btn btn-primary" onclick="addUser()">➕ Neuer Benutzer</button>
		<button class="btn btn-success" onclick="save()">💾 Speichern</button>
		<button class="btn btn-secondary" onclick="exportUsers()">📤 Export</button>
	</div>

	<div class="table-card">
		<div class="table-wrapper">
			<table id="tbl">
				<thead>
					<tr>
						<th>Token</th>
						<th>Wohnung</th>
						<th>Fläche (m²)</th>
						<th>Einzug</th>
						<th>Auszug</th>
						<th>Aktionen</th>
					</tr>
				</thead>
				<tbody></tbody>
			</table>
		</div>
	</div>

	<div class="total-area">
		<span>Gesamtfläche:</span>
		<span class="value" id="totalArea">0 m²</span>
	</div>

	<div id="status"></div>
</div>

<div class="footer">
	Selbst-Ableser · weil deine Daten dir gehören
	<br>
	<a href="index.html">Startseite</a>
	<a href="impressum.html">Impressum</a>
	<a href="datenschutz.html">Datenschutz</a>
</div>

<script>
let users = {};

// Initiales Laden der Daten
fetch(`/users/data`, {
	credentials: "same-origin"
})
.then(r => {
	if (!r.ok) throw new Error("HTTP " + r.status);
	return r.json();
})
.then(data => {
	users = data;
	renderUsers();
})
.catch(err => {
	console.error("API error:", err);
	showError("Fehler beim Laden der Benutzerdaten");
});

function isAdmin(user) {
	return !user || !user.flat || user.flat.trim() === "";
}

function isCurrentResident(user) {
	if (!user) return false;
	const today = new Date().toISOString().split('T')[0];
	const moveIn = user.move_in || "";
	const moveOut = user.move_out || "";
	
	const hasMovedIn = !moveIn || moveIn <= today;
	const hasNotMovedOut = !moveOut || moveOut > today;
	
	return hasMovedIn && hasNotMovedOut;
}

function getSortedTokens() {
	return Object.keys(users).sort((a, b) => {
		const userA = users[a];
		const userB = users[b];
		
		// Admins zuerst
		const isAdminA = isAdmin(userA);
		const isAdminB = isAdmin(userB);
		
		if (isAdminA && !isAdminB) return -1;
		if (!isAdminA && isAdminB) return 1;
		
		// Dann nach Wohnung sortieren
		const flatA = (userA?.flat || "").toLowerCase();
		const flatB = (userB?.flat || "").toLowerCase();
		
		return flatA.localeCompare(flatB);
	});
}

function hasDateOverlap(token, flat, moveIn, moveOut) {
	if (!flat || flat.trim() === "") return false;
	
	for (const [otherToken, otherUser] of Object.entries(users)) {
		if (otherToken === token) continue;
		if (!otherUser || !otherUser.flat || otherUser.flat !== flat) continue;
		
		const otherMoveIn = otherUser.move_in || "";
		const otherMoveOut = otherUser.move_out || "";
		
		// Prüfe Überschneidungen
		// Fall 1: Dieser Einzug liegt vor dem Auszug des anderen
		// Fall 2: Dieser Auszug liegt nach dem Einzug des anderen
		if (moveIn && otherMoveOut && moveIn < otherMoveOut && (!moveOut || moveOut > otherMoveIn || !otherMoveIn)) {
			return true;
		}
		if (moveOut && otherMoveIn && moveOut > otherMoveIn && (!moveIn || moveIn < otherMoveOut || !otherMoveOut)) {
			return true;
		}
		// Wenn beide Zeiträume sich überschneiden
		if (moveIn && moveOut && otherMoveIn && otherMoveOut) {
			if (!(moveOut <= otherMoveIn || moveIn >= otherMoveOut)) {
				return true;
			}
		}
		// Wenn einer keinen Auszug hat (unbegrenzt)
		if (!moveOut && otherMoveIn && (!moveIn || moveIn <= otherMoveIn)) {
			return true;
		}
		if (!otherMoveOut && moveIn && (!otherMoveIn || otherMoveIn <= moveIn)) {
			return true;
		}
	}
	
	return false;
}

function flatHasNoArea(flat) {
	if (!flat || flat.trim() === "") return false;
	
	for (const [token, user] of Object.entries(users)) {
		if (user && user.flat === flat && user.area && user.area > 0) {
			return false;
		}
	}
	return true;
}

function renderUsers() {
	const tb = document.querySelector("#tbl tbody");
	
	if (Object.keys(users).length === 0) {
		tb.innerHTML = `
			<tr>
				<td colspan="6">
					<div class="empty-state">
						<div class="empty-state-icon">👥</div>
						<div>Noch keine Benutzer angelegt</div>
						<div style="font-size: 0.9rem; margin-top: 0.5rem;">Klicken Sie auf "Neuer Benutzer" um zu beginnen</div>
					</div>
				</td>
			</tr>
		`;
		updateTotalArea();
		return;
	}

	tb.innerHTML = "";
	const sortedTokens = getSortedTokens();
	
	for (const token of sortedTokens) {
		const u = users[token];
		const tr = document.createElement('tr');
		const admin = isAdmin(u);
		const currentResident = isCurrentResident(u);
		
		// Validierung
		const areaHasError = !admin && !currentResident && u.area && u.area > 0;
		const moveOutBeforeMoveIn = u.move_in && u.move_out && u.move_out <= u.move_in;
		const datesHaveOverlap = !admin && hasDateOverlap(token, u.flat, u.move_in, u.move_out);
		const flatMissingArea = !admin && u.flat && u.flat.trim() !== "" && flatHasNoArea(u.flat);
		
		tr.innerHTML = `
			<td><span class="token ${admin ? 'admin' : ''}">${token}${admin ? ' 👑' : ''}</span></td>
			<td><input type="text" 
				class="flat-input ${flatMissingArea ? 'error' : ''}"
				value="${u?.flat ?? ""}" 
				onchange="updateUser('${token}','flat',this.value)"
				onblur="renderUsers()"></td>
			<td>
				<input type="number" step="0.1" min="0"
					class="${areaHasError ? 'error' : ''}"
					value="${admin ? '' : (u?.area ?? '')}"
					${admin ? 'disabled' : ''}
					onchange="updateUser('${token}','area',this.value === '' ? null : parseFloat(this.value))"
					onblur="renderUsers()">
			</td>
			<td><input type="date" 
				class="${(moveOutBeforeMoveIn || datesHaveOverlap) ? 'error' : ''}"
				value="${u?.move_in ?? ""}" 
				onchange="updateUser('${token}','move_in',this.value)"
				onblur="renderUsers()"></td>
			<td><input type="date" 
				class="${(moveOutBeforeMoveIn || datesHaveOverlap) ? 'error' : ''}"
				value="${u?.move_out ?? ""}" 
				onchange="updateUser('${token}','move_out',this.value)"
				onblur="renderUsers()"></td>
			<td>
				<div class="actions-cell">
					<button class="btn btn-link" onclick="openUvi('${token}')">🔗 UVI</button>
					<button class="btn btn-danger" onclick="del('${token}')">❌</button>
				</div>
			</td>
		`;
		tb.appendChild(tr);
	}
	
	updateTotalArea();
}

function updateTotalArea() {
	let total = 0;
	for (const [token, user] of Object.entries(users)) {
		if (!isAdmin(user) && isCurrentResident(user) && user.area) {
			total += parseFloat(user.area) || 0;
		}
	}
	document.getElementById('totalArea').textContent = total.toFixed(2) + ' m²';
}

function updateUser(token, key, val) {
	if (!users[token]) users[token] = {};
	
	if (key === 'flat') {
		users[token][key] = val || null;
		// Wenn Wohnung geleert wird (Admin), Fläche auf null setzen
		if (!val || val.trim() === "") {
			users[token].area = null;
		}
	} else if (key === 'area') {
		// Fläche nur setzen wenn kein Admin
		if (!isAdmin(users[token])) {
			users[token][key] = val;
		} else {
			users[token][key] = null;
		}
	} else {
		users[token][key] = val || null;
	}
}

function del(token) {
	if(confirm(`Benutzer ${token} wirklich löschen?`)) {
		delete users[token];
		renderUsers();
	}
}

function addUser() {
	const newToken = crypto.getRandomValues(new Uint8Array(8))
		.reduce((s,b)=>s+b.toString(16).padStart(2,"0"),"");
	users[newToken] = { flat: "", area: null, move_in: null, move_out: null };
	renderUsers();
}

function hasAdmin(users) {
	return Object.values(users).some(u => !u || u.flat == null || u.flat === "");
}

function getAdminTokenFromUsers(users) {
	for (const [token, u] of Object.entries(users)) {
		if (!u || u.flat == null || u.flat === "") {
			return token;
		}
	}
	return null;
}

function save() {
	const status = document.getElementById("status");
	status.innerHTML = "";

	if (!hasAdmin(users)) {
		showError("Es muss mindestens ein Admin-Benutzer existieren (ohne Wohnungszuordnung).");
		return;
	}

	// Fläche bei Admins auf null setzen vor dem Speichern
	const cleanedUsers = {};
	for (const [token, user] of Object.entries(users)) {
		cleanedUsers[token] = { ...user };
		if (isAdmin(cleanedUsers[token])) {
			cleanedUsers[token].area = null;
		}
	}

	fetch(`/users/save`, {
		method: "POST",
		headers: { "Content-Type": "application/json" },
		credentials: "same-origin",
		body: JSON.stringify(cleanedUsers)
	})
	.then(r => {
		if (!r.ok) throw new Error("Speichern fehlgeschlagen");
		return r.json();
	})
	.then(() => {
		showSuccess(`
			✅ Benutzer erfolgreich gespeichert.<br><br>
			<a href="/index.html">👉 Zurück zur Admin-Oberfläche</a>
		`);
	})
	.catch(err => {
		showError("Fehler beim Speichern der Benutzerdaten");
		console.error(err);
	});
}

function exportUsers() {
	fetch("/users/export", {
		credentials: "same-origin"
	})
	.then(r => {
		if (!r.ok) throw new Error("Export fehlgeschlagen");
		return r.blob(); // Datei als Blob
	})
	.then(blob => {
		// Download starten
		const url = URL.createObjectURL(blob);
		const a = document.createElement('a');
		a.href = url;
		a.download = "users.json";
		document.body.appendChild(a);
		a.click();
		a.remove();
		URL.revokeObjectURL(url);
	})
	.catch(err => {
		showError("Fehler beim Export der Benutzerdaten");
		console.error(err);
	});
}


function openUvi(token) {
	window.open("/uvi.html", "_blank");
}

function showError(message) {
	const status = document.getElementById("status");
	status.innerHTML = `<div class="status-box error">${message}</div>`;
}

function showSuccess(message) {
	const status = document.getElementById("status");
	status.innerHTML = `<div class="status-box success">${message}</div>`;
}
</script>
