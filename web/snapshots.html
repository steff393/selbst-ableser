<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<title>Selbst-Ableser – Snapshots</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style>
		:root {
			--color-primary: #0d7377;
			--color-primary-light: #14a3a8;
			--color-primary-dark: #0a5254;
			--color-accent: #f4a259;
			--color-success: #52b788;
			--color-danger: #e63946;
			--color-bg: #f8f9fb;
			--color-surface: #ffffff;
			--color-surface-hover: #f5f7fa;
			--color-text-primary: #1a2332;
			--color-text-secondary: #5a6a7f;
			--color-text-muted: #8493a8;
			--color-border: #e3e8ef;
			--color-border-light: #f0f3f7;
			--shadow-sm: 0 1px 3px rgba(13, 115, 119, 0.04), 0 1px 2px rgba(13, 115, 119, 0.02);
			--shadow-md: 0 4px 6px rgba(13, 115, 119, 0.06), 0 2px 4px rgba(13, 115, 119, 0.04);
			--shadow-lg: 0 10px 15px rgba(13, 115, 119, 0.08), 0 4px 6px rgba(13, 115, 119, 0.04);
			--radius-sm: 8px;
			--radius-md: 12px;
			--radius-lg: 16px;
			--transition-fast: 100ms cubic-bezier(0.4, 0, 0.2, 1);
			--transition-base: 150ms cubic-bezier(0.4, 0, 0.2, 1);
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: linear-gradient(135deg, #f8f9fb 0%, #eef2f7 100%);
			color: var(--color-text-primary);
			line-height: 1.6;
			min-height: 100vh;
			padding: 1rem;
		}

		.container {
			max-width: 1200px;
			margin: 0 auto;
		}

		.header {
			text-align: center;
			margin-bottom: 1rem;
			padding: 1rem;
			background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
			border-radius: var(--radius-lg);
			box-shadow: var(--shadow-lg);
			color: white;
			position: relative;
			overflow: hidden;
		}

		.header::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
			opacity: 0.4;
		}

		.header h1 {
			font-size: clamp(1.5rem, 4vw, 2rem);
			font-weight: 700;
			position: relative;
		}

		.header .subtitle {
			font-size: 0.9rem;
			opacity: 0.95;
			font-weight: 300;
			position: relative;
			margin-top: 0.25rem;
		}

		.actions-bar {
			background: var(--color-surface);
			border-radius: var(--radius-lg);
			padding: 0.75rem 1rem;
			margin-bottom: 1rem;
			box-shadow: var(--shadow-md);
			display: flex;
			gap: 0.75rem;
			flex-wrap: wrap;
		}

		.tab-btn {
			padding: 0.5rem 1rem;
			border: none;
			border-radius: var(--radius-sm);
			font-size: 0.95rem;
			font-weight: 500;
			cursor: pointer;
			transition: all var(--transition-base);
			background: transparent;
			color: var(--color-text-secondary);
			border: 1px solid var(--color-border);
		}

		.tab-btn.active {
			background: var(--color-primary);
			color: white;
			border-color: var(--color-primary);
		}

		.tab-btn:hover {
			background: var(--color-primary);
			color: white;
			border-color: var(--color-primary);
		}

		.card {
			padding: 1rem;
			margin-bottom: 1rem;
		}

		.table-card {
			background: var(--color-surface);
			border-radius: var(--radius-lg);
			overflow: hidden;
			box-shadow: var(--shadow-md);
			margin-bottom: 1rem;
		}

		.card-header {
			display: flex;
			align-items: start;
			gap: 1rem;
			margin-bottom: 0.75rem;
		}

		.card-icon {
			font-size: 2rem;
			flex-shrink: 0;
		}

		.card-title {
			font-size: 1.3rem;
			font-weight: 600;
			color: var(--color-text-primary);
			margin-bottom: 0.25rem;
		}

		.card-description {
			color: var(--color-text-secondary);
			font-size: 0.95rem;
			line-height: 1.6;
		}

		.summary-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 1rem;
			margin-bottom: 1rem;
		}

		.summary-card {
			background: var(--color-surface-hover);
			border: 1px solid var(--color-border-light);
			border-radius: var(--radius-md);
			padding: 1rem;
		}

		.summary-card strong {
			display: block;
			font-size: 1.1rem;
			margin-bottom: 0.25rem;
		}

		.controls {
			display: flex;
			flex-wrap: wrap;
			gap: 0.75rem;
			align-items: center;
			margin-bottom: 1rem;
		}

		.table-wrapper {
			overflow-x: auto;
		}

		table {
			width: 100%;
			border-collapse: separate;
			border-spacing: 0;
		}

		thead {
			background: linear-gradient(to right, var(--color-bg), var(--color-surface));
			position: sticky;
			top: 0;
			z-index: 1;
		}

		th {
			padding: 0.75rem 0.5rem;
			text-align: left;
			font-size: 0.85rem;
			font-weight: 600;
			color: var(--color-text-secondary);
			text-transform: uppercase;
			letter-spacing: 0.5px;
			border-bottom: 2px solid var(--color-border);
		}

		td {
			padding: 0.1rem 0.5rem;
			border-bottom: 1px solid var(--color-border-light);
			font-size: 0.95rem;
			color: var(--color-text-primary);
		}

		tbody tr {
			transition: background var(--transition-fast);
		}

		tbody tr:hover {
			background: var(--color-surface-hover);
		}

		tbody tr:last-child td {
			border-bottom: none;
		}

		.status-box {
			background: var(--color-surface);
			border-radius: var(--radius-lg);
			padding: 1rem;
			margin-top: 1rem;
			box-shadow: var(--shadow-md);
		}

		.status-box.success {
			border-left: 4px solid var(--color-success);
			background: linear-gradient(135deg, rgba(82, 183, 136, 0.08) 0%, rgba(82, 183, 136, 0.05) 100%);
		}

		.status-box.error {
			border-left: 4px solid var(--color-danger);
			background: linear-gradient(135deg, rgba(230, 57, 70, 0.08) 0%, rgba(230, 57, 70, 0.05) 100%);
		}

		.btn {
			padding: 0.5rem 1rem;
			border: none;
			border-radius: var(--radius-sm);
			font-size: 0.95rem;
			font-weight: 500;
			cursor: pointer;
			transition: all var(--transition-base);
			display: inline-flex;
			align-items: center;
			gap: 0.5rem;
			text-decoration: none;
		}

		.btn-primary {
			background: var(--color-primary);
			color: white;
		}

		.btn-primary:hover {
			background: var(--color-primary-dark);
			transform: translateY(-1px);
			box-shadow: var(--shadow-sm);
		}

		.btn-outline {
			background: transparent;
			border: 1px solid var(--color-primary);
			color: var(--color-primary);
		}

		.btn-outline:hover {
			background: var(--color-primary);
			color: white;
		}

		.footer {
			text-align: center;
			color: var(--color-text-muted);
			font-size: 0.85rem;
			margin-top: 2rem;
			padding: 1.5rem 1rem;
			border-top: 1px solid var(--color-border-light);
		}

		.footer a {
			color: var(--color-text-secondary);
			margin: 0 0.75rem;
			text-decoration: none;
			transition: color var(--transition-base);
		}

		.footer a:hover {
			color: var(--color-primary);
		}

		@media (max-width: 768px) {
			.actions-bar {
				flex-direction: column;
				align-items: stretch;
			}

			th, td {
				padding: 0.6rem 0.4rem;
			}
		}
	</style>
</head>
<body>
<div class="container">
	<div class="header">
		<h1>Snapshots</h1>
		<div class="subtitle">Download von Snapshot-Dateien</div>
	</div>

	<div class="actions-bar">
		<button id="tabSnapshot" class="tab-btn active">Snapshots (<span id="snapshotCount">–</span>)</button>
		<button id="tabBackup" class="tab-btn">USB-Stick (<span id="backupCount">–</span>)</button>
		<div style="flex: 1;"></div>
		<button id="selectAllBtn" class="btn btn-outline">Alle auswählen</button>
		<button id="clearSelectionBtn" class="btn btn-outline">Auswahl aufheben</button>
		<button id="downloadBtn" class="btn btn-primary">Herunterladen</button>
	</div>

	<div class="table-card">
		<div class="table-wrapper">
			<table>
				<thead>
					<tr>
						<th style="width: 2rem;"><input id="selectAllCheckbox" type="checkbox" aria-label="Alle auswählen"></th>
						<th>Dateiname</th>
						<th>Größe</th>
						<th>Änderung</th>
					</tr>
				</thead>
				<tbody id="snapshotTableBody">
				</tbody>
			</table>
		</div>
	</div>

	<div id="snapshotStatus"></div>
</div>

<div class="footer">
	Selbst-Ableser · weil deine Daten dir gehören<br>
	<a href="index.html">Startseite</a>
	<a href="impressum.html">Impressum</a>
	<a href="datenschutz.html">Datenschutz</a>
</div>

<script>
	const snapshotCountEl = document.getElementById('snapshotCount');
	const backupCountEl = document.getElementById('backupCount');
	const snapshotTableBody = document.getElementById('snapshotTableBody');
	const snapshotStatus = document.getElementById('snapshotStatus');
	const selectAllCheckbox = document.getElementById('selectAllCheckbox');
	const selectAllBtn = document.getElementById('selectAllBtn');
	const clearSelectionBtn = document.getElementById('clearSelectionBtn');
	const downloadBtn = document.getElementById('downloadBtn');
	const tabSnapshot = document.getElementById('tabSnapshot');
	const tabBackup = document.getElementById('tabBackup');

	let allFiles = [];
	let currentSource = 'snapshot';

	function showStatus(type, message) {
		snapshotStatus.innerHTML = `<div class="status-box ${type}">${message}</div>`;
	}

	function formatSize(bytes) {
		if (bytes < 1024) return `${bytes} B`;
		if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
		return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
	}

	function updateSelectAllState() {
		const rows = snapshotTableBody.querySelectorAll('input[type="checkbox"]');
		const checked = Array.from(rows).filter(input => input.checked).length;
		selectAllCheckbox.checked = checked > 0 && checked === rows.length;
		selectAllCheckbox.indeterminate = checked > 0 && checked < rows.length;
	}

	function buildRow(file) {
		const row = document.createElement('tr');
		const checkbox = document.createElement('input');
		checkbox.type = 'checkbox';
		checkbox.dataset.name = file.name;
		checkbox.dataset.source = file.source;
		checkbox.addEventListener('change', updateSelectAllState);

		const nameCell = document.createElement('td');
		nameCell.textContent = file.name;

		const sizeCell = document.createElement('td');
		sizeCell.textContent = formatSize(file.size);

		const modifiedCell = document.createElement('td');
		modifiedCell.textContent = new Date(file.modified).toLocaleString('de-DE');

		const checkboxCell = document.createElement('td');
		checkboxCell.appendChild(checkbox);

		row.appendChild(checkboxCell);
		row.appendChild(nameCell);
		row.appendChild(sizeCell);
		row.appendChild(modifiedCell);
		return row;
	}

	function renderTable() {
		const filteredFiles = allFiles.filter(file => file.source === currentSource);
		snapshotTableBody.innerHTML = '';

		if (filteredFiles.length === 0) {
			snapshotTableBody.innerHTML = '<tr><td colspan="4">Keine Snapshot-Dateien gefunden.</td></tr>';
			return;
		}

		filteredFiles.forEach(file => {
			snapshotTableBody.appendChild(buildRow(file));
		});
		selectAllCheckbox.checked = false;
		selectAllCheckbox.indeterminate = false;
	}

	async function loadSnapshotList() {
		try {
			const response = await fetch('/snapshots/list');
			if (!response.ok) {
				throw new Error('Fehler beim Laden der Snapshot-Liste');
			}
			const data = await response.json();

			allFiles = data.files;
			snapshotCountEl.textContent = data.counts.snapshot;
			backupCountEl.textContent = data.counts.backup;
			renderTable();
		} catch (error) {
			console.error(error);
			showStatus('error', 'Snapshot-Liste konnte nicht geladen werden.');
		}
	}

	function switchTab(source) {
		currentSource = source;
		tabSnapshot.classList.toggle('active', source === 'snapshot');
		tabBackup.classList.toggle('active', source === 'backup');
		renderTable();
	}

	function getSelectedFiles() {
		return Array.from(snapshotTableBody.querySelectorAll('input[type="checkbox"]'))
			.filter(input => input.checked)
			.map(input => ({ name: input.dataset.name, source: input.dataset.source }));
	}

	async function downloadSelected() {
		const files = getSelectedFiles();
		if (!files.length) {
			showStatus('error', 'Bitte wähle mindestens eine Datei aus.');
			return;
		}

		try {
			const response = await fetch('/snapshots/download', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ files }),
			});

			if (!response.ok) {
				let message = 'Download fehlgeschlagen.';
				try {
					const json = await response.json();
					message = json.detail || message;
				} catch (_err) {}
				throw new Error(message);
			}

			const blob = await response.blob();
			const disposition = response.headers.get('Content-Disposition') || '';
			const filenameMatch = disposition.match(/filename="(.+)"/);
			const filename = filenameMatch ? filenameMatch[1] : 'snapshots.zip';
			const url = URL.createObjectURL(blob);
			const link = document.createElement('a');
			link.href = url;
			link.download = filename;
			document.body.appendChild(link);
			link.click();
			link.remove();
			URL.revokeObjectURL(url);
			showStatus('success', `Download gestartet: ${filename}`);
		} catch (error) {
			console.error(error);
			showStatus('error', error.message || 'Download fehlgeschlagen.');
		}
	}

	selectAllCheckbox.addEventListener('change', (event) => {
		snapshotTableBody.querySelectorAll('input[type="checkbox"]').forEach(input => {
			input.checked = event.target.checked;
		});
	});

	selectAllBtn.addEventListener('click', () => {
		snapshotTableBody.querySelectorAll('input[type="checkbox"]').forEach(input => {
			input.checked = true;
		});
		selectAllCheckbox.checked = true;
		selectAllCheckbox.indeterminate = false;
	});

	clearSelectionBtn.addEventListener('click', () => {
		snapshotTableBody.querySelectorAll('input[type="checkbox"]').forEach(input => {
			input.checked = false;
		});
		selectAllCheckbox.checked = false;
		selectAllCheckbox.indeterminate = false;
	});

	downloadBtn.addEventListener('click', downloadSelected);

	tabSnapshot.addEventListener('click', () => switchTab('snapshot'));
	tabBackup.addEventListener('click', () => switchTab('backup'));

	loadSnapshotList();
</script>
</body>
</html>
