<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<title>E-Mail Konfiguration</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style>
		:root {
			--color-primary: #0d7377;
			--color-primary-light: #14a3a8;
			--color-primary-dark: #0a5254;
			--color-accent: #f4a259;
			--color-success: #52b788;
			--color-danger: #e63946;
			--color-admin: #9b59b6;
			
			--color-bg: #f8f9fb;
			--color-surface: #ffffff;
			--color-surface-hover: #f5f7fa;
			
			--color-text-primary: #1a2332;
			--color-text-secondary: #5a6a7f;
			--color-text-muted: #8493a8;
			--color-border: #e3e8ef;
			--color-border-light: #f0f3f7;
			
			--shadow-sm: 0 1px 3px rgba(13, 115, 119, 0.04), 0 1px 2px rgba(13, 115, 119, 0.02);
			--shadow-md: 0 4px 6px rgba(13, 115, 119, 0.06), 0 2px 4px rgba(13, 115, 119, 0.04);
			--shadow-lg: 0 10px 15px rgba(13, 115, 119, 0.08), 0 4px 6px rgba(13, 115, 119, 0.04);
			
			--radius-sm: 8px;
			--radius-md: 12px;
			--radius-lg: 16px;
			
			--transition-fast: 100ms cubic-bezier(0.4, 0, 0.2, 1);
			--transition-base: 150ms cubic-bezier(0.4, 0, 0.2, 1);
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: linear-gradient(135deg, #f8f9fb 0%, #eef2f7 100%);
			color: var(--color-text-primary);
			line-height: 1.6;
			min-height: 100vh;
			padding: 1rem;
		}

		.container {
			max-width: 800px;
			margin: 0 auto;
		}

		.header {
			text-align: center;
			margin-bottom: 1rem;
			padding: 1rem;
			background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
			border-radius: var(--radius-lg);
			box-shadow: var(--shadow-lg);
			color: white;
			position: relative;
			overflow: hidden;
		}

		.header::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
			opacity: 0.4;
		}

		.header h1 {
			font-size: clamp(1.5rem, 4vw, 2rem);
			font-weight: 700;
			position: relative;
		}

		.header .subtitle {
			font-size: 0.9rem;
			opacity: 0.95;
			font-weight: 300;
			position: relative;
			margin-top: 0.25rem;
		}

		.actions-bar {
			background: var(--color-surface);
			border-radius: var(--radius-lg);
			padding: 0.75rem 1rem;
			margin-bottom: 1rem;
			box-shadow: var(--shadow-md);
			display: flex;
			gap: 0.75rem;
			flex-wrap: wrap;
		}

		.btn {
			padding: 0.5rem 1rem;
			border: none;
			border-radius: var(--radius-sm);
			font-size: 0.95rem;
			font-weight: 500;
			cursor: pointer;
			transition: all var(--transition-base);
			display: inline-flex;
			align-items: center;
			gap: 0.5rem;
		}

		.btn-primary {
			background: var(--color-primary);
			color: white;
		}

		.btn-primary:hover {
			background: var(--color-primary-dark);
			transform: translateY(-1px);
			box-shadow: var(--shadow-sm);
		}

		.btn-success {
			background: var(--color-success);
			color: white;
		}

		.btn-success:hover {
			background: #3d9970;
			transform: translateY(-1px);
			box-shadow: var(--shadow-sm);
		}

		.btn-secondary {
			background: var(--color-text-muted);
			color: white;
		}

		.btn-secondary:hover {
			background: var(--color-text-secondary);
			transform: translateY(-1px);
			box-shadow: var(--shadow-sm);
		}

		.btn-danger {
			background: transparent;
			border: 1px solid var(--color-danger);
			color: var(--color-danger);
			padding: 0.35rem 0.75rem;
			font-size: 0.85rem;
		}

		.btn-danger:hover {
			background: var(--color-danger);
			color: white;
		}

		.btn-small {
			padding: 0.3rem 0.6rem;
			font-size: 0.82rem;
		}

		/* Form card */
		.form-card {
			background: var(--color-surface);
			border-radius: var(--radius-lg);
			overflow: hidden;
			box-shadow: var(--shadow-md);
			margin-bottom: 1rem;
		}

		.form-body {
			padding: 1.5rem;
			display: flex;
			flex-direction: column;
			gap: 1.25rem;
		}

		.field-group {
			display: flex;
			flex-direction: column;
			gap: 0.35rem;
		}

		.field-label {
			font-size: 0.82rem;
			font-weight: 600;
			color: var(--color-text-secondary);
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}

		.field-hint {
			font-size: 0.8rem;
			color: var(--color-text-muted);
			margin-top: 0.2rem;
		}

		input[type="text"],
		input[type="email"],
		input[type="password"],
		input[type="url"] {
			width: 100%;
			padding: 0.5rem 0.75rem;
			border: 1px solid var(--color-border);
			border-radius: var(--radius-sm);
			font-size: 0.95rem;
			transition: all var(--transition-fast);
			background: white;
			color: var(--color-text-primary);
		}

		input:focus {
			outline: none;
			border-color: var(--color-primary);
			box-shadow: 0 0 0 3px rgba(13, 115, 119, 0.1);
		}

		input.error {
			background: rgba(230, 57, 70, 0.08);
			border-color: rgba(230, 57, 70, 0.3);
		}

		/* Recipients */
		.recipients-list {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
		}

		.recipient-row {
			display: flex;
			gap: 0.5rem;
			align-items: center;
		}

		.recipient-row input {
			flex: 1;
		}

		.add-recipient-btn {
			display: inline-flex;
			align-items: center;
			gap: 0.4rem;
			background: transparent;
			border: 1px dashed var(--color-primary);
			color: var(--color-primary);
			padding: 0.4rem 0.75rem;
			border-radius: var(--radius-sm);
			font-size: 0.88rem;
			cursor: pointer;
			transition: all var(--transition-base);
			margin-top: 0.25rem;
			width: fit-content;
		}

		.add-recipient-btn:hover {
			background: var(--color-primary);
			color: white;
			border-style: solid;
		}

		/* Divider between sections */
		.field-divider {
			border: none;
			border-top: 1px solid var(--color-border-light);
			margin: 0.25rem 0;
		}

		/* Status */
		.status-box {
			background: var(--color-surface);
			border-radius: var(--radius-lg);
			padding: 1rem;
			margin-top: 1rem;
			box-shadow: var(--shadow-md);
		}

		.status-box.success {
			border-left: 4px solid var(--color-success);
			background: linear-gradient(135deg, rgba(82, 183, 136, 0.08) 0%, rgba(82, 183, 136, 0.05) 100%);
		}

		.status-box.error {
			border-left: 4px solid var(--color-danger);
			background: linear-gradient(135deg, rgba(230, 57, 70, 0.08) 0%, rgba(230, 57, 70, 0.05) 100%);
		}

		.status-box a {
			color: var(--color-primary);
			text-decoration: none;
			font-weight: 600;
		}

		.status-box a:hover {
			text-decoration: underline;
		}

		.footer {
			text-align: center;
			color: var(--color-text-muted);
			font-size: 0.85rem;
			margin-top: 2rem;
			padding: 1.5rem 1rem;
			border-top: 1px solid var(--color-border-light);
		}

		.footer a {
			color: var(--color-text-secondary);
			margin: 0 0.75rem;
			text-decoration: none;
			transition: color var(--transition-base);
		}

		.footer a:hover {
			color: var(--color-primary);
			text-decoration: underline;
		}

		@media (max-width: 768px) {
			.actions-bar {
				flex-direction: column;
			}

			.btn {
				width: 100%;
				justify-content: center;
			}

			.form-body {
				padding: 1rem;
			}
		}

		@media print {
			body {
				background: white;
				padding: 0;
			}

			.actions-bar,
			.btn {
				display: none;
			}

			.form-card {
				box-shadow: none;
			}

			.footer {
				display: none;
			}
		}
	</style>
</head>
<body>

<div class="container">
	<div class="header">
		<h1>E-Mail Konfiguration</h1>
		<div class="subtitle">Einstellungen für den E-Mail-Versand</div>
	</div>

	<div class="actions-bar">
		<button class="btn btn-success" onclick="save()">💾 Speichern</button>
		<button class="btn btn-secondary" onclick="testEmail()">📧 Test</button>
		<button class="btn btn-secondary" onclick="exportEmail()">📤 Export</button>
	</div>

	<div class="form-card">
		<div class="form-body">

			<!-- Absender -->
			<div class="field-group">
				<label class="field-label">📧 Absender</label>
				<input type="email" id="field-sender" placeholder="z.B. selbst-ableser@gmx.de"
					oninput="updateField('sender', this.value)">
			</div>

			<!-- Passwort -->
			<div class="field-group">
				<label class="field-label">🔒 Passwort</label>
				<input type="text" id="field-password" placeholder="SMTP-Passwort"
					oninput="updateField('password', this.value)">
			</div>

			<hr class="field-divider">

			<!-- Empfänger -->
			<div class="field-group">
				<label class="field-label">👥 Empfänger (Erster Empfänger sollte Admin sein)</label>
				<div class="recipients-list" id="recipients-list"></div>
				<button class="add-recipient-btn" onclick="addRecipient()">➕ Empfänger hinzufügen</button>
			</div>

			<hr class="field-divider">

			<!-- Betreff -->
			<div class="field-group">
				<label class="field-label">✉️ Betreff</label>
				<input type="text" id="field-subject" placeholder="Unterjährige Verbrauchsinformation"
					oninput="updateField('subject', this.value)">
			</div>

			<!-- Link -->
			<div class="field-group">
				<label class="field-label">🔗 Link (link)</label>
				<input type="url" id="field-link" placeholder="z.B. http://192.168.178.94:8080/"
					oninput="updateField('link', this.value)">
				<div class="field-hint">URL, die in der E-Mail verlinkt wird.</div>
			</div>

		</div>
	</div>

	<div id="status"></div>
</div>

<div class="footer">
	Selbst-Ableser · weil deine Daten dir gehören
	<br>
	<a href="index.html">Startseite</a>
	<a href="impressum.html">Impressum</a>
	<a href="datenschutz.html">Datenschutz</a>
</div>

<script>
let emailConfig = {
	sender: "",
	password: "",
	to: [],
	subject: "Unterjährige Verbrauchsinformation",
	link: "",
};

// Initiales Laden der Daten
fetch(`/email/data`, {
	credentials: "same-origin"
})
.then(r => {
	if (!r.ok) throw new Error("HTTP " + r.status);
	return r.json();
})
.then(data => {
	emailConfig = {
		sender:   data.sender   ?? "",
		password: data.password ?? "",
		to:       Array.isArray(data.to) ? data.to : (data.to ? [data.to] : []),
		subject:  data.subject || "Unterjährige Verbrauchsinformation",
		link:     data.link     ?? "",
	};
	renderForm();
})
.catch(err => {
	console.error("API error:", err);
	showError("Fehler beim Laden der E-Mail-Konfiguration");
});

function renderForm() {
	document.getElementById('field-sender').value  = emailConfig.sender;
	document.getElementById('field-password').value = emailConfig.password;
	document.getElementById('field-subject').value = emailConfig.subject;
	document.getElementById('field-link').value    = emailConfig.link;
	renderRecipients();
}

function renderRecipients() {
	const list = document.getElementById('recipients-list');
	list.innerHTML = "";

	const recipients = emailConfig.to.length > 0 ? emailConfig.to : [""];

	recipients.forEach((email, idx) => {
		const row = document.createElement('div');
		row.className = 'recipient-row';
		row.innerHTML = `
			<input type="email" placeholder="empfaenger@beispiel.de"
				value="${escapeHtml(email)}"
				oninput="updateRecipient(${idx}, this.value)">
			<button class="btn btn-danger btn-small" onclick="removeRecipient(${idx})" title="Entfernen">❌</button>
		`;
		list.appendChild(row);
	});
}

function escapeHtml(str) {
	return String(str)
		.replace(/&/g, "&amp;")
		.replace(/"/g, "&quot;")
		.replace(/</g, "&lt;")
		.replace(/>/g, "&gt;");
}

function updateField(key, value) {
	emailConfig[key] = value;
}

function updateRecipient(idx, value) {
	emailConfig.to[idx] = value;
}

function addRecipient() {
	emailConfig.to.push("");
	renderRecipients();
	// Fokus auf das neue Feld
	const inputs = document.querySelectorAll('#recipients-list input');
	if (inputs.length > 0) {
		inputs[inputs.length - 1].focus();
	}
}

function removeRecipient(idx) {
	emailConfig.to.splice(idx, 1);
	renderRecipients();
}

function getCleanConfig() {
	return {
		sender:   emailConfig.sender.trim(),
		password: emailConfig.password,
		to:       emailConfig.to.map(e => e.trim()).filter(e => e !== ""),
		subject:  emailConfig.subject.trim(),
		link:     emailConfig.link.trim(),
	};
}

function getCookie(name) {
	const value = `; ${document.cookie}`;
	const parts = value.split(`; ${name}=`);
	if (parts.length === 2) {
		return parts.pop().split(';').shift();
	}
	return null;
}

function save() {
	const status = document.getElementById("status");
	status.innerHTML = "";

	const config = getCleanConfig();

	if (!config.sender) {
		showError("Bitte eine Absender-E-Mail-Adresse eingeben.");
		return;
	}
	if (!config.password) {
		showError("Bitte ein Passwort eingeben.");
		return;
	}
	if (config.to.length === 0) {
		showError("Bitte mindestens einen Empfänger angeben.");
		return;
	}

	fetch(`/email/save`, {
		method: "POST",
		headers: { "Content-Type": "application/json", "X-CSRF-Token": getCookie("csrf_token") },
		credentials: "same-origin",
		body: JSON.stringify(config)
	})
	.then(r => {
		if (!r.ok) throw new Error("Speichern fehlgeschlagen");
		return r.json();
	})
	.then(() => {
		showSuccess(`
			✅ E-Mail-Konfiguration erfolgreich gespeichert.<br><br>
			<a href="/index.html">👉 Zurück zur Admin-Oberfläche</a>
		`);
	})
	.catch(err => {
		showError("Fehler beim Speichern der E-Mail-Konfiguration");
		console.error(err);
	});
}

function exportEmail() {
	fetch("/email/export", {
		credentials: "same-origin"
	})
	.then(r => {
		if (!r.ok) throw new Error("Export fehlgeschlagen");
		return r.blob();
	})
	.then(blob => {
		const url = URL.createObjectURL(blob);
		const a = document.createElement('a');
		a.href = url;
		a.download = "email.json";
		document.body.appendChild(a);
		a.click();
		a.remove();
		URL.revokeObjectURL(url);
	})
	.catch(err => {
		showError("Fehler beim Export der E-Mail-Konfiguration");
		console.error(err);
	});
}

function testEmail() {
	const status = document.getElementById("status");
	status.innerHTML = "";

	const config = getCleanConfig();

	if (!config.sender) {
		showError("Bitte eine Absender-E-Mail-Adresse eingeben.");
		return;
	}
	if (!config.password) {
		showError("Bitte ein Passwort eingeben.");
		return;
	}
	if (config.to.length === 0) {
		showError("Bitte mindestens einen Empfänger angeben.");
		return;
	}

	fetch(`/email/test`, {
		method: "POST",
		headers: { "Content-Type": "application/json", "X-CSRF-Token": getCookie("csrf_token") },
		credentials: "same-origin",
		body: JSON.stringify(config)
	})
	.then(r => {
		if (!r.ok) throw new Error("Test fehlgeschlagen");
		return r.json();
	})
	.then(() => {
		showSuccess("✅ Test-E-Mail erfolgreich versendet!");
	})
	.catch(err => {
		showError("Fehler beim Versenden der Test-E-Mail");
		console.error(err);
	});
}

function showError(message) {
	const status = document.getElementById("status");
	status.innerHTML = `<div class="status-box error">${message}</div>`;
}

function showSuccess(message) {
	const status = document.getElementById("status");
	status.innerHTML = `<div class="status-box success">${message}</div>`;
}
</script>

</body>
</html>
