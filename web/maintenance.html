<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Wartung – Selbst-Ableser</title>
	<style>
		*, *::before, *::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		:root {
			--teal:       #0d7377;
			--teal-dark:  #0a5254;
			--teal-light: #14a8ad;
			--bg:         #f0f4f8;
			--card:       #ffffff;
			--text:       #1a2e35;
			--muted:      #5a6a7f;
			--border:     #e3e8ef;
		}

		body {
			font-family: 'DM Sans', sans-serif;
			background: var(--bg);
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 2rem;
			overflow: hidden;
		}

		/* Subtle animated background */
		body::before {
			content: '';
			position: fixed;
			inset: 0;
			background:
				radial-gradient(ellipse 80% 60% at 20% 10%, rgba(13,115,119,0.07) 0%, transparent 60%),
				radial-gradient(ellipse 60% 50% at 80% 90%, rgba(20,168,173,0.06) 0%, transparent 55%);
			pointer-events: none;
			z-index: 0;
		}

		.card {
			position: relative;
			z-index: 1;
			background: var(--card);
			border-radius: 16px;
			box-shadow:
				0 4px 6px rgba(0,0,0,0.04),
				0 12px 40px rgba(13,115,119,0.08);
			padding: 3rem 2.5rem;
			max-width: 420px;
			width: 100%;
			text-align: center;
			border: 1px solid var(--border);
		}

		/* Animated icon */
		.icon-wrap {
			width: 72px;
			height: 72px;
			margin: 0 auto 1.75rem;
			background: linear-gradient(135deg, #e8f7f7 0%, #d0eeef 100%);
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			animation: pulse 3s ease-in-out infinite;
		}

		@keyframes pulse {
			0%, 100% { box-shadow: 0 0 0 0 rgba(13,115,119,0.15); }
			50%       { box-shadow: 0 0 0 12px rgba(13,115,119,0); }
		}

		.icon-wrap svg {
			width: 36px;
			height: 36px;
			color: var(--teal);
		}

		h1 {
			font-size: 1.5rem;
			font-weight: 500;
			color: var(--text);
			margin-bottom: 0.75rem;
			letter-spacing: -0.02em;
		}

		p {
			color: var(--muted);
			font-size: 0.95rem;
			line-height: 1.6;
			font-weight: 300;
		}
	</style>
</head>
<body>
	<div class="card">
		<div class="icon-wrap">
			<!-- wrench icon -->
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
				fill="none" stroke="currentColor" stroke-width="1.8"
				stroke-linecap="round" stroke-linejoin="round">
				<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77
					a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91
					a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
			</svg>
		</div>

		<h1>Kurze Wartungspause</h1>
		<p>Der Selbst-Ableser wird gerade aktualisiert.<br>In Kürze sind wir wieder für Sie da.</p>
	</div>
</body>
</html>
