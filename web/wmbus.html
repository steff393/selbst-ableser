<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>wM-Bus Auswertung</title>
	<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
	<text x="50%" y="30%" font-size="36" font-family="Arial" fill="blue" text-anchor="middle" dominant-baseline="middle">wM</text>
	<text x="50%" y="85%" font-size="36" font-family="Arial" fill="blue" text-anchor="middle" dominant-baseline="middle">Bus</text>
	</svg>'>
	<style>
		:root {
			--color-primary: #0d7377;
			--color-primary-light: #14a3a8;
			--color-primary-dark: #0a5254;
			--color-accent: #f4a259;
			--color-accent-warm: #ff8c42;
			--color-success: #52b788;
			--color-warning: #f4a259;
			--color-danger: #e63946;
			
			--color-bg: #f8f9fb;
			--color-bg-elevated: #ffffff;
			--color-surface: #ffffff;
			--color-surface-hover: #f5f7fa;
			
			--color-text-primary: #1a2332;
			--color-text-secondary: #5a6a7f;
			--color-text-muted: #8493a8;
			--color-border: #e3e8ef;
			--color-border-light: #f0f3f7;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			background: linear-gradient(135deg, #f8f9fb 0%, #eef2f7 100%);
			min-height: 100vh;
			padding: 20px;
		}

		.container {
			max-width: 1400px;
			margin: 0 auto;
			background: var(--color-bg-elevated);
			border-radius: 12px;
			box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), 0 10px 40px rgba(0, 0, 0, 0.15);
			overflow: hidden;
		}

		header {
			background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
			color: white;
			padding: 30px;
			text-align: center;
		}

		header h1 {
			font-size: 2.5em;
			margin-bottom: 10px;
			font-weight: bold;
		}

		.stats {
			display: flex;
			justify-content: center;
			gap: 40px;
			margin-top: 20px;
			flex-wrap: wrap;
		}

		.stat-item {
			text-align: center;
		}

		.stat-value {
			font-size: 1.8em;
		}

		.stat-label {
			font-size: 0.9em;
			opacity: 0.9;
			margin-top: 5px;
		}

		.controls {
			padding: 20px 30px;
			background: var(--color-bg);
			border-bottom: 1px solid var(--color-border);
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
			align-items: center;
		}

		.search-box {
			flex: 1;
			min-width: 200px;
			padding: 10px 15px;
			border: 2px solid var(--color-border);
			border-radius: 6px;
			font-size: 14px;
			transition: all 0.3s;
		}

		.search-box:focus {
			outline: none;
			border-color: var(--color-primary);
			box-shadow: 0 0 0 3px rgba(13, 115, 119, 0.1);
		}

		button {
			padding: 10px 20px;
			background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
			color: white;
			border: none;
			border-radius: 6px;
			cursor: pointer;
			font-size: 14px;
			font-weight: 500;
			transition: all 0.3s;
		}

		button:hover {
			transform: translateY(-2px);
			box-shadow: 0 4px 12px rgba(13, 115, 119, 0.4);
		}

		button:active {
			transform: translateY(0);
		}

		.status {
			padding: 15px 30px;
			text-align: center;
			font-weight: 500;
		}

		.status.error {
			background: #fee;
			color: var(--color-danger);
		}

		.status.success {
			background: #efe;
			color: var(--color-success);
		}

		.table-container {
			padding: 30px;
			overflow-x: auto;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			background: var(--color-surface);
		}

		thead {
			background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
			color: white;
		}

		th {
			padding: 15px;
			text-align: left;
			font-weight: 600;
			cursor: pointer;
			user-select: none;
			position: relative;
		}

		th:hover {
			background: rgba(255, 255, 255, 0.1);
		}

		th.sortable::after {
			content: '↕';
			display: block;
			margin-top: 4px;
			opacity: 0.5;
			font-size: 0.8em;
		}

		th.sorted-asc::after {
			content: '↑';
			display: block;
			margin-top: 4px;
			opacity: 1;
		}

		th.sorted-desc::after {
			content: '↓';
			display: block;
			margin-top: 4px;
			opacity: 1;
		}

		tbody tr {
			border-bottom: 1px solid var(--color-border);
			transition: all 0.2s;
		}

		tbody tr:hover {
			background: var(--color-surface-hover);
		}

		tbody tr.hidden {
			display: none;
		}

		td {
			padding: 12px 15px;
		}

		.rssi {
			font-weight: 600;
			padding: 4px 8px;
			border-radius: 4px;
			display: inline-block;
		}

		.rssi.excellent {
			background: #d4edda;
			color: var(--color-success);
		}

		.rssi.good {
			background: #d1ecf1;
			color: var(--color-primary);
		}

		.rssi.fair {
			background: #fff3cd;
			color: var(--color-warning);
		}

		.rssi.poor {
			background: #f8d7da;
			color: var(--color-danger);
		}

		.wmbus-link {
			color: var(--color-primary);
			text-decoration: none;
			font-family: 'Courier New', monospace;
			font-size: 0.9em;
		}

		.wmbus-link:hover {
			text-decoration: underline;
		}

		.badge {
			display: inline-block;
			padding: 4px 10px;
			border-radius: 4px;
			font-size: 0.85em;
			font-weight: 600;
		}

		.badge.manufacturer {
			background: #e3f2fd;
			color: var(--color-primary);
		}

		.badge.type {
			background: #f3e5f5;
			color: var(--color-primary-dark);
		}

		.badge.encrypted {
			background: var(--color-warning);
			color: white;
		}

		.badge.unencrypted {
			background: var(--color-success);
			color: white;
		}

		.pagination {
			padding: 20px 30px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			border-top: 1px solid var(--color-border);
			background: var(--color-bg);
		}

		.page-info {
			color: var(--color-text-secondary);
			font-size: 14px;
		}

		.page-controls {
			display: flex;
			gap: 5px;
		}

		.page-btn {
			padding: 8px 12px;
			background: var(--color-surface);
			color: var(--color-primary);
			border: 1px solid var(--color-border);
			cursor: pointer;
			font-size: 14px;
		}

		.page-btn:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		.page-btn.active {
			background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
			color: white;
			border-color: transparent;
		}

		.loading {
			text-align: center;
			padding: 40px;
			color: var(--color-text-secondary);
		}

		.spinner {
			border: 3px solid var(--color-border-light);
			border-top: 3px solid var(--color-primary);
			border-radius: 50%;
			width: 40px;
			height: 40px;
			animation: spin 1s linear infinite;
			margin: 0 auto 20px;
		}

		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}

		@media (max-width: 768px) {
			header h1 {
				font-size: 1.8em;
			}

			.stats {
				gap: 20px;
			}

			.stat-value {
				font-size: 1.5em;
			}

			.controls {
				flex-direction: column;
			}

			.search-box {
				width: 100%;
			}

			button {
				width: 100%;
			}

			table {
				font-size: 0.85em;
			}

			th, td {
				padding: 8px;
			}
		}
	</style>
</head>
<body>
	<div class="container">
		<header>
			<h1>wM-Bus Daten-Dashboard</h1>
			<div class="stats">
				<div class="stat-item">
					<div class="stat-value" id="deviceCount">-</div>
					<div class="stat-label">Geräte</div>
				</div>
				<div class="stat-item">
					<div class="stat-value" id="lastUpdate">-</div>
					<div class="stat-label">Letztes Update</div>
				</div>
				<div class="stat-item">
					<div class="stat-value" id="avgRssi">-</div>
					<div class="stat-label">Ø RSSI</div>
				</div>
			</div>
		</header>

		<div class="controls">
			<input type="text" class="search-box" id="searchBox" placeholder="🔍 Suche nach ID, Hersteller, Typ...">
			<select id="snapshotSelect" class="search-box" style="max-width:220px;">
				<option value="">📅 Snapshot wählen...</option>
			</select>
			<button id="updateBtn">Aktualisieren</button>
			<button id="snapshotBtn">Snapshot</button>
			<button id="exportBtn">Export CSV</button>
		</div>

		<div id="status" class="status" style="display: none;"></div>

		<div class="table-container">
			<div id="loading" class="loading">
				<div class="spinner"></div>
				<div>Lade Daten...</div>
			</div>
			<table id="wmbusTable" style="display: none;">
				<thead>
					<tr>
						<th class="sortable" data-column="id">ID</th>
						<th class="sortable" data-column="timestamp">Zeit</th>
						<th class="sortable" data-column="rssi">RSSI</th>
						<th class="sortable" data-column="manufacturer">Herst.</th>
						<th class="sortable" data-column="type">Typ</th>
						<th class="sortable" data-column="encrypted">Verschlüsselt</th>
						<th data-column="wmbus">wM-Bus Telegramm</th>
					</tr>
				</thead>
				<tbody id="tableBody"></tbody>
			</table>
		</div>

		<div class="pagination" id="pagination" style="display: none;">
			<div class="page-info" id="pageInfo"></div>
			<div class="page-controls" id="pageControls"></div>
		</div>
	</div>

	<script>
		// Parse deutsches Datumsformat
		function parseGermanDate(str) {
			const [datePart, timePart] = str.split(" ");
			const [day, month, year] = datePart.split(".");
			const [hour, minute, second] = timePart.split(":");
			return new Date(year, month - 1, day, hour, minute, second);
		}

		// Globale Variablen
		let allData = [];
		let filteredData = [];
		let currentPage = 1;
		let rowsPerPage = 25;
		let sortColumn = 'id';
		let sortDirection = 'asc';

		// Manufacturer extrahieren
		function int2_le(bytes) {
			return bytes[0] + (bytes[1] << 8);
		}

		function man2txt(tg) {
			let k = int2_le(tg.slice(2, 4));
			const a = Math.floor(k / 1024);
			k %= 1024;
			const b = Math.floor(k / 32);
			const c = k % 32;
			return String.fromCharCode(a + 64, b + 64, c + 64);
		}

		function typ2txt(tg) {
			const val = tg[9];
			const MEDIUM_TYPES = {
				0x00: { code: "OTH", name: "Other", de: "Anderes" },
				0x01: { code: "OIL", name: "Oil", de: "Öl" },
				0x02: { code: "ELC", name: "Electricity", de: "Elektrizität" },
				0x03: { code: "GAS", name: "Gas", de: "Gas" },
				0x04: { code: "WMZ", name: "Heat (return)", de: "Wärme (Rücklauf)" },
				0x05: { code: "STM", name: "Steam", de: "Dampf" },
				0x06: { code: "WWZ", name: "Hot Water", de: "Warmwasser" },
				0x07: { code: "KWZ", name: "Water", de: "Wasser" },
				0x08: { code: "HKV", name: "Heat Cost Allocator", de: "Heizkostenverteiler" },
				0x80: { code: "HKV", name: "Heat Cost Allocator", de: "Heizkostenverteiler" }, // special case for TCH
				0x09: { code: "AIR", name: "Compressed Air", de: "Pressluft" },
				0x0A: { code: "CLR", name: "Cooling (return)", de: "Kühlung (Rücklauf)" },
				0x0B: { code: "CLF", name: "Cooling (flow)", de: "Kühlung (Vorlauf)" },
				0x0C: { code: "HTF", name: "Heat (flow)", de: "Wärme (Vorlauf)" },
				0x0D: { code: "HCX", name: "Heat / Cooling", de: "Wärme/Kühlung" },
				0x0E: { code: "BUS", name: "Bus / System", de: "Bus / System" },
				0x0F: { code: "UNK", name: "Unknown", de: "Unbekannt" },
				0x14: { code: "CAL", name: "Calorific value", de: "Heiz-/Brennwert" },
				0x15: { code: "BHW", name: "Boiling Water", de: "Heißwasser" },
				0x16: { code: "CLD", name: "Cold Water", de: "Kaltwasser" },
				0x17: { code: "DUW", name: "Dual Water", de: "Mischwasser" },
				0x18: { code: "PRS", name: "Pressure", de: "Druck" },
				0x19: { code: "ADC", name: "A/D Converter", de: "A/D Wandler" },
				0x1A: { code: "SMK", name: "Smoke detector", de: "Rauchmelder" },
				0x1B: { code: "RMS", name: "Room sensor", de: "Raumsensor" },
				0x1C: { code: "GDT", name: "Gas detector", de: "Gasdetektor" },
				0x20: { code: "CBR", name: "Circuit breaker", de: "Unterbrecher" },
				0x21: { code: "VAL", name: "Valve", de: "Ventil" },
				0x25: { code: "DSP", name: "Display", de: "Anzeige" },
				0x28: { code: "SEW", name: "Sewage", de: "Abwasser" },
				0x29: { code: "WST", name: "Waste", de: "Abfall" },
				0x2A: { code: "CO2", name: "Carbon dioxide", de: "Kohlendioxid" },
				// Table 2 values
				0x31: { code: "COM", name: "Communication controller", de: "Kommunikationssteuergerät" },
				0x32: { code: "UNI", name: "Unidirectional repeater", de: "Unidirektionaler Repeater" },
				0x33: { code: "BIR", name: "Bidirectional repeater", de: "Bidirektionaler Repeater" },
				0x36: { code: "RCS", name: "Radio converter (system side)", de: "Funkumsetzer (Systemseite)" },
				0x37: { code: "RCM", name: "Radio converter (meter side)", de: "Funkumsetzer (Zählerseite)" },
				0x38: { code: "WIR", name: "Wired adapter", de: "Drahtgebundener Adapter" },
				// Inofficial values
				0xF0: { code: "SMK", name: "Smoke detector(?)", de: "Rauchmelder(?)" }
			};
			if (MEDIUM_TYPES[val]) {
				return MEDIUM_TYPES[val].code;
			} else {
				//return { code: "UNK", name: "Unknown", de: "Unbekannt" };
				return("???");
			}
		}

		// Prüfe ob Telegramm verschlüsselt ist (CI-Feld, Byte 10)
		function isEncrypted(tg) {
			if (tg.length < 11) return false;
			
			const ci = tg[10];
			
			// CI = 0x78 (kein tplh) oder 0xA0 (Mfct specific) → nie verschlüsselt
			if (ci === 0x78 || ci === 0xA0) return false;
			
			// CI = 0x7A → kurzer tplh, tpl-cfg High-Byte liegt bei Byte 14
			if (ci === 0x7A) {
				if (tg.length < 15) return false;
				const encMode = tg[14] & 0x07; // Bits [2:0] des High-Bytes
				return encMode !== 0;
			}

			// CI = 0x72 → langer tplh (4 Byte ID + 2 Byte Mfct + version + type + acc + sts + cfg)
			// tpl-cfg High-Byte bei Byte 22
			if (ci === 0x72) {
					if (tg.length < 23) return false;
					const encMode = tg[22] & 0x07 // Bits [2:0] des High-Bytes
					return encMode !== 0;
			}
			
			// CI = 0x8C → ELL, tpl-cfg High-Byte liegt bei Byte 34
			// Aufbau: 10=ELL-CI, 11=ell-cc, 12=ell-acc,
			//         13=afl-ci, 14=afl-len (=15), dann AFL-Daten,
			//         30=tpl-ci, 31=acc, 32=sts, 33/34=tpl-cfg
			if (ci === 0x8C) {
				if (tg.length < 35) return false;
				const encMode = tg[34] & 0x07;
				return encMode !== 0;
			}
			
			// Alle anderen CI-Felder: sicherheitshalber als verschlüsselt behandeln
			return true;
		}

		// RSSI Klassifizierung
		function getRssiClass(rssi) {
			const val = parseInt(rssi);
			if (val >= -50) return 'excellent';
			if (val >= -70) return 'good';
			if (val >= -85) return 'fair';
			return 'poor';
		}

		// Daten laden
		async function loadData() {
			try {
				document.getElementById('loading').style.display = 'block';
				document.getElementById('wmbusTable').style.display = 'none';
				
				const response = await fetch(`data`);
				
				if (!response.ok) {
					showStatus("Fehler beim Laden der Daten.", 'error');
					return;
				}
				
				const data = await response.json();
				allData = [];

				for (let id in data) {
					let row = data[id];
					let wmbus = [];
					for (let i = 0; i < row.wmbus.length; i += 2) {
						wmbus.push(parseInt(row.wmbus.substr(i, 2), 16));
					}

					allData.push({
						id: id,
						timestamp: row.timestamp,
						timestampDate: parseGermanDate(row.timestamp),
						rssi: parseInt(row.rssi),
						manufacturer: wmbus.length >= 4 ? man2txt(wmbus) : 'N/A',
						type: wmbus.length >= 10 ? typ2txt(wmbus) : 'N/A',
						encrypted: wmbus.length >= 11 ? isEncrypted(wmbus) : false,
						wmbus: row.wmbus,
						wmbusBytes: wmbus
					});
				}

				filteredData = [...allData];
				updateStatistics();
				sortAndRender();
				
				document.getElementById('loading').style.display = 'none';
				document.getElementById('wmbusTable').style.display = 'table';
				document.getElementById('pagination').style.display = 'flex';

			} catch(err) {
				console.error(err);
				showStatus("Fehler beim Laden der Daten.", 'error');
				document.getElementById('loading').style.display = 'none';
			}
		}

		function parseGermanDate(str) {
			const [datePart, timePart] = str.split(" ");
			const [day, month, year] = datePart.split(".");
			const [hour, minute, second] = timePart.split(":");

			return new Date(year, month - 1, day, hour, minute, second);
		}

		// Statistiken aktualisieren
		function updateStatistics() {
			document.getElementById('deviceCount').textContent = allData.length;
			
			if (allData.length > 0) {
				// Finde das neueste Telegramm basierend auf timestampDate
				const latest = allData.reduce((a, b) => {
					const dateA = (a.timestampDate);
					const dateB = (b.timestampDate);
					// Prüfe ob Daten gültig sind
					if (!dateA || isNaN(dateA.getTime())) return b;
					if (!dateB || isNaN(dateB.getTime())) return a;
					return dateA > dateB ? a : b;
				});
				
				// Formatiere das Datum korrekt
				if (latest.timestampDate && !isNaN(latest.timestampDate.getTime())) {
					document.getElementById('lastUpdate').textContent = 
						latest.timestampDate.toLocaleTimeString('de-DE', {
							hour: '2-digit',
							minute: '2-digit',
							second: '2-digit'
						});
				} else {
					document.getElementById('lastUpdate').textContent = 'N/A';
				}
				
				const avgRssi = Math.round(
					allData.reduce((sum, item) => sum + item.rssi, 0) / allData.length
				);
				document.getElementById('avgRssi').textContent = avgRssi + ' dBm';
			}
		}

		// Status anzeigen
		function showStatus(message, type) {
			const statusEl = document.getElementById('status');
			statusEl.textContent = message;
			statusEl.className = `status ${type}`;
			statusEl.style.display = 'block';
			setTimeout(() => {
				statusEl.style.display = 'none';
			}, 1000);
		}

		// Sortierung
		function sortData(column) {
			if (sortColumn === column) {
				sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
			} else {
				sortColumn = column;
				sortDirection = 'asc';
			}
			sortAndRender();
		}

		function sortAndRender() {
			filteredData.sort((a, b) => {
				let valA = a[sortColumn];
				let valB = b[sortColumn];
				
				if (sortColumn === 'rssi') {
					valA = parseInt(valA);
					valB = parseInt(valB);
				}
				
				if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
				if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
				return 0;
			});

			// Update Header
			document.querySelectorAll('th.sortable').forEach(th => {
				th.classList.remove('sorted-asc', 'sorted-desc');
				if (th.dataset.column === sortColumn) {
					th.classList.add(`sorted-${sortDirection}`);
				}
			});

			renderTable();
		}

		// Tabelle rendern
		function renderTable() {
			const tbody = document.getElementById('tableBody');
			tbody.innerHTML = '';

			const start = (currentPage - 1) * rowsPerPage;
			const end = start + rowsPerPage;
			const pageData = filteredData.slice(start, end);

			pageData.forEach(item => {
				const row = document.createElement('tr');
				const encryptedBadge = item.encrypted 
					? '<span class="badge encrypted">🔒 Ja</span>'
					: '<span class="badge unencrypted">🔓 Nein</span>';
				
				row.innerHTML = `
					<td><strong>${item.id}</strong></td>
					<td>${item.timestamp}</td>
					<td><span class="rssi ${getRssiClass(item.rssi)}">${item.rssi} dBm</span></td>
					<td><span class="badge manufacturer">${item.manufacturer}</span></td>
					<td><span class="badge type">${item.type}</span></td>
					<td>${encryptedBadge}</td>
					<td><a href="https://wmbusmeters.org/analyze/${item.wmbus}" target="_blank" class="wmbus-link">${item.wmbus}</a></td>
				`;
				tbody.appendChild(row);
			});

			renderPagination();
		}

		// Pagination
		function renderPagination() {
			const totalPages = Math.ceil(filteredData.length / rowsPerPage);
			const pageInfo = document.getElementById('pageInfo');
			const pageControls = document.getElementById('pageControls');

			pageInfo.textContent = `Zeige ${(currentPage - 1) * rowsPerPage + 1}-${Math.min(currentPage * rowsPerPage, filteredData.length)} von ${filteredData.length} Einträgen`;

			pageControls.innerHTML = '';

			// Previous button
			const prevBtn = document.createElement('button');
			prevBtn.className = 'page-btn';
			prevBtn.textContent = '‹';
			prevBtn.disabled = currentPage === 1;
			prevBtn.onclick = () => changePage(currentPage - 1);
			pageControls.appendChild(prevBtn);

			// Page numbers
			for (let i = 1; i <= totalPages; i++) {
				if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
					const pageBtn = document.createElement('button');
					pageBtn.className = 'page-btn' + (i === currentPage ? ' active' : '');
					pageBtn.textContent = i;
					pageBtn.onclick = () => changePage(i);
					pageControls.appendChild(pageBtn);
				} else if (i === currentPage - 3 || i === currentPage + 3) {
					const dots = document.createElement('span');
					dots.textContent = '...';
					dots.style.padding = '8px';
					pageControls.appendChild(dots);
				}
			}

			// Next button
			const nextBtn = document.createElement('button');
			nextBtn.className = 'page-btn';
			nextBtn.textContent = '›';
			nextBtn.disabled = currentPage === totalPages;
			nextBtn.onclick = () => changePage(currentPage + 1);
			pageControls.appendChild(nextBtn);
		}

		function changePage(page) {
			currentPage = page;
			renderTable();
		}

		async function loadSnapshotList() {
			try {
				const response = await fetch("list");
				if (!response.ok) return;

				const data = await response.json();

				// limit to 10 last elements
				const lastTen = data.slice(-10).reverse();

				const select = document.getElementById("snapshotSelect");
				select.innerHTML = '<option value="">📅 Snapshot wählen...</option>';

				lastTen.forEach(date => {
					const opt = document.createElement("option");
					opt.value = date;
					opt.textContent = date;
					select.appendChild(opt);
				});

			} catch (err) {
				console.error("Snapshot-Liste Fehler:", err);
			}
		}
		
		document.getElementById("snapshotSelect").addEventListener("change", async (e) => {
			const value = e.target.value;
			if (!value) return;

			try {
				await fetch(`load/${value}`);
				loadData(); 
				showStatus("Snapshot geladen!", "success");
			} catch (err) {
				showStatus("Fehler beim Laden des Snapshots", "error");
			}
		});

		// Suche
		document.getElementById('searchBox').addEventListener('input', (e) => {
			const searchTerm = e.target.value.toLowerCase();
			filteredData = allData.filter(item => 
				item.id.toLowerCase().includes(searchTerm) ||
				item.manufacturer.toLowerCase().includes(searchTerm) ||
				item.type.toLowerCase().includes(searchTerm) ||
				item.wmbus.toLowerCase().includes(searchTerm)
			);
			currentPage = 1;
			sortAndRender();
		});

		// Sortierung Event-Listener
		document.querySelectorAll('th.sortable').forEach(th => {
			th.addEventListener('click', () => {
				sortData(th.dataset.column);
			});
		});

		// Buttons
		document.getElementById('updateBtn').addEventListener('click', () => {
			loadData();
		});

		document.getElementById('snapshotBtn').addEventListener('click', async () => {
			try {
				const token = window.location.pathname.substring(1);
				await fetch(`${token}/snapshot`);
				showStatus('Snapshot erstellt!', 'success');
			} catch(err) {
				showStatus('Fehler beim Erstellen des Snapshots', 'error');
			}
		});

		// CSV Export
		document.getElementById('exportBtn').addEventListener('click', () => {
			let csv = 'ID,Zeitpunkt,RSSI,Hersteller,Typ,Verschlüsselt,WMBus\n';
			filteredData.forEach(item => {
				const encrypted = item.encrypted ? 'Ja' : 'Nein';
				csv += `"${item.id}","${item.timestamp}","${item.rssi}","${item.manufacturer}","${item.type}","${encrypted}","${item.wmbus}"\n`;
			});
			
			const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
			const link = document.createElement('a');
			link.href = URL.createObjectURL(blob);
			link.download = 'wmbus_daten_' + new Date().toISOString().slice(0,10) + '.csv';
			link.click();
			
			showStatus('CSV-Export erfolgreich!', 'success');
		});

		// Initial laden
		loadData();
		loadSnapshotList();
	</script>
</body>
</html>
