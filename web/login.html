<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login – Selbst-Ableser</title>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: linear-gradient(135deg, #f8f9fb 0%, #eef2f7 100%);
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			margin: 0;
		}

		.login-box {
			background: white;
			padding: 2rem;
			border-radius: 12px;
			box-shadow: 0 8px 20px rgba(0,0,0,0.08);
			width: 100%;
			max-width: 360px;
			text-align: center;
		}

		h1 {
			margin-bottom: 1rem;
			font-size: 1.8rem;
			color: #0d7377;
		}

		p {
			margin-bottom: 1.5rem;
			color: #5a6a7f;
			font-size: 0.95rem;
		}

		input[type="text"] {
			width: 100%;
			padding: 0.5rem 0;
			font-size: 1rem;
			margin-bottom: 1rem;
			border: 1px solid #e3e8ef;
			border-radius: 8px;
			outline: none;
			transition: all 0.15s ease-in-out;
		}

		input[type="text"]:focus {
			border-color: #0d7377;
			box-shadow: 0 0 0 3px rgba(13, 115, 119, 0.1);
		}

		button {
			width: 100%;
			padding: 0.55rem 0;
			background: #0d7377;
			color: white;
			font-size: 1rem;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			transition: background 0.15s ease-in-out, transform 0.1s;
		}

		button:hover {
			background: #0a5254;
			transform: translateY(-1px);
		}

		.status {
			margin-top: 1rem;
			font-size: 0.9rem;
			color: #e63946;
		}
	</style>
</head>
<body>
	<div class="login-box">
		<h1>Login</h1>
		<p>Bitte geben Sie Ihren Zugangstoken ein</p>
		<form id="loginForm">
			<input type="text" name="token" placeholder="Token" required>
			<button type="submit">Anmelden</button>
		</form>
		<div class="status" id="status"></div>
	</div>

	<script>
		const form = document.getElementById("loginForm");
		const status = document.getElementById("status");

		form.addEventListener("submit", async (e) => {
			e.preventDefault();
			status.textContent = "";

			const token = e.target.token.value.trim();
			if(!token) return;

			try {
				const res = await fetch("/login", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ token }),
					credentials: "same-origin"
				});

				if(res.ok) {
					status.style.color = "#52b788"; // grün
					status.textContent = "✅ Erfolgreich angemeldet";
					// kleine Verzögerung, damit User die Meldung sieht
					setTimeout(async () => {
						let isAdmin = false;
						try {
							const adminCheck = await fetch("/users/data", { credentials: "same-origin" });
							if (adminCheck.ok) {
								const data = await adminCheck.json();
								// Wenn data nicht leer ist, Admin (oder zumindest Zugriff auf users/data)
								if (data && Object.keys(data).length > 0) {
									isAdmin = true;
								}
							}
						} catch (_) {
							// Zugriff fehlgeschlagen → kein Admin
							isAdmin = false;
						}

						if (isAdmin) {
							location.href = "/index.html"; // Admin-Seite
						} else {
							location.href = "/uvi.html"; // normaler Nutzer
						}
					}, 800);
				} else {
					status.style.color = "#e63946"; // rot
					status.textContent = "❌ Login fehlgeschlagen";
				}
			} catch(err) {
				status.style.color = "#e63946";
				status.textContent = "❌ Fehler beim Login";
				console.error(err);
			}
		});
	</script>
</body>
</html>
