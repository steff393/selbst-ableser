{{define "content"}}
<div class="page-head">
  <div>
    <h1>Zählerstände</h1>
    <p class="page-sub">Die im Archiv gespeicherten Zählerstände, Zähler für Zähler.</p>
  </div>
</div>

{{if .Error}}<p class="error">{{.Error}}</p>{{end}}

<div class="rd-bar">
  <nav class="rd-presets" aria-label="Zeitraum-Schnellauswahl">
    {{range .Presets}}<a class="rd-preset{{if .Active}} on{{end}}" href="/operator/readings?from={{.From}}&amp;to={{.To}}"{{if .Active}} aria-current="true"{{end}}>{{.Label}}</a>{{end}}
  </nav>
  <form method="get" action="/operator/readings" class="rd-range">
    <label>Von <input type="date" name="from" value="{{.Filter.From}}" onchange="this.form.submit()"></label>
    <label>Bis <input type="date" name="to" value="{{.Filter.To}}" onchange="this.form.submit()"></label>
  </form>
  <span class="rd-bar-gap"></span>
  <nav class="rd-presets rd-csv" aria-label="Als CSV exportieren">
    <span class="rd-csv-label">CSV</span>
    <a class="rd-preset" id="readings-export-link" href="/operator/readings/export?{{.Filter.QueryString}}"
       title="Alle Telegramme von Von bis Bis, eine Zeile je Telegramm — für die Zähler, die in der Liste stehen">Telegramme</a>
    <a class="rd-preset" href="/operator/readings/keyday?day={{.Filter.To}}"
       title="Ein Zählerstand je Zähler am Bis-Datum, für ein Abrechnungsprogramm. Fehlt das Telegramm dieses Tages, wird bis zu {{.LookbackDays}} Tage zurückgesucht und das in der Spalte „Hinweis“ vermerkt.">Stichtag {{.KeyDayLabel}}</a>
  </nav>
</div>

<div class="rd-layout">
  <aside class="rd-side">
    <div class="rd-side-top">
      <input type="search" id="rd-q" placeholder="Suchen …" title="Wohnung, Raum, Zählerplatz oder Zählernummer" aria-label="Zähler suchen">
      <div class="rd-chips" id="rd-typechips"></div>
    </div>
    <div class="rd-list" id="rd-list"></div>
  </aside>
  <section class="rd-detail" id="rd-detail"></section>
</div>
<div class="rd-tip" id="rd-tip" role="tooltip"></div>

<script>
window.SA_READINGS = {{.RowsJSON}};
window.SA_METER_SUMMARY = {{.MeterSummaryJSON}};
window.SA_UNIT_ORDER = {{.UnitOrderJSON}};
window.SA_READINGS_RANGE = {from: "{{.Filter.From}}", to: "{{.Filter.To}}"};
</script>
<script src="/static/readings.js"></script>
{{end}}
