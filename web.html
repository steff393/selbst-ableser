<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<title>wM-Bus Auswertung</title>
	<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
	<text x="50%" y="30%" font-size="36" font-family="Arial" fill="blue" text-anchor="middle" dominant-baseline="middle">wM</text>
	<text x="50%" y="85%" font-size="36" font-family="Arial" fill="blue" text-anchor="middle" dominant-baseline="middle">Bus</text>
	</svg>'>
	<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
	<style>
		body { font-family: Arial, sans-serif; margin: 20px; }
		table { width: 100%; }
		th, td { text-align: center; }
		h1 { text-align: center; }
	</style>
</head>
<body>
	<h1>wM-Bus Daten</h1>
	<div id="status" style="color: red; text-align: center; margin-bottom: 20px;"></div>
	<button id="exportBtn" style="margin-bottom: 10px;">Export to Excel</button>
	<button id="updateBtn" style="margin-bottom: 10px;">Aktualisieren</button>
	<button id="snapshotBtn" style="margin-bottom: 10px;">Snapshot</button>
	<table id="wmbusTable" class="display">
		<thead>
			<tr>
				<th>ID</th>
				<th>Zeitpunkt</th>
				<th>RSSI</th>
				<th>Hersteller</th>
				<th>Typ</th>
				<th>Altes Datum</th>
				<th>Alter Zählerstand</th>
				<th>Aktuelles Datum</th>
				<th>Aktueller Zählerstand</th>
				<th>Raumtemperatur (°C)</th>
				<th>Heizkörpertemp. (°C)</th>
				<th>WMBus</th>
			</tr>
		</thead>
		<tbody></tbody>
	</table>

	<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
	<script>
		// Little-Endian 2-Byte Integer
		function int2_le(bytes) {
			return bytes[0] + (bytes[1] << 8);
		}

		// Decode WMBus telegram from Techem heat cost allocator
		function TCH_HKV(tg) {
			// Previous & Current Date
			let prevDate = int2_le(tg.slice(12,14));
			let currDate = int2_le(tg.slice(16,18));

			let d_prev = (prevDate >> 0) & 0x1F;
			let m_prev = (prevDate >> 5) & 0x0F;
			let y_prev = 2000 + ((prevDate >> 9) & 0x3F);
			let prevDateStr = `${y_prev}-${String(m_prev).padStart(2,'0')}-${String(d_prev).padStart(2,'0')}`;

			let d_curr = (currDate >> 4) & 0x1F; if(d_curr<=0) d_curr=1;
			let m_curr = (currDate >> 9) & 0x0F; if(m_curr<=0) m_curr=12;
			let y_curr = y_prev;
			if(m_curr < m_prev || (m_curr == m_prev && d_curr <= d_prev)) y_curr += 1;
			let currDateStr = `${y_curr}-${String(m_curr).padStart(2,'0')}-${String(d_curr).padStart(2,'0')}`;

			// Temperatures
			let tempRoom = int2_le(tg.slice(20,22))/100.0;
			let tempRad  = int2_le(tg.slice(22,24))/100.0;

			return {
				manufacturer: "Techem",
				device: "HKV",
				prevDate: prevDateStr,
				currDate: currDateStr,
				prevHCA: int2_le(tg.slice(14,16)),
				currHCA: int2_le(tg.slice(18,20)),
				tempRoom: tempRoom.toFixed(2),
				tempRad: tempRad.toFixed(2)
			};
		}


		// Decode WMBus telegram from Techem heat cost allocator
		function TCH_WMZ(tg) {
			return {
				manufacturer: "Techem",
				device: "WMZ",
				prevDate: "N/A",
				currDate: "N/A",
				prevHCA: "N/A",
				currHCA: "N/A",
				tempRoom: "N/A",
				tempRad: "N/A"
			};
		}


		async function loadData() {
			try {
				//let response = await fetch("/data");
				//let response = await fetch("/data/2023-01-23"); 
				const token = window.location.pathname.substring(1); // alles nach '/'
				let response = await fetch(`${token}/data`);
				if (!response.ok) {
					document.getElementById('status').textContent = "Token ungültig oder keine Berechtigung.";
					return;
				}
				
				let data = await response.json();

				let tbody = $("#wmbusTable tbody");
				for(let id in data) {
					let row = data[id];
					let wmbus = [];
					for (let i = 0; i < row.wmbus.length; i += 2) { // Convert hex string to array of bytes
						wmbus.push(parseInt(row.wmbus.substr(i,2),16));
					}
					let decoded = {
						manufacturer: "N/A",
						device: "N/A",
						prevDate: "N/A",
						currDate: "N/A",
						prevHCA: "N/A",
						currHCA: "N/A",
						tempRoom: "N/A",
						tempRad: "N/A"
					};
					if (wmbus.length >= 24 && wmbus[2] === 0x68 && wmbus[3] === 0x50 && wmbus[9] === 0x80) {
						decoded = TCH_HKV(wmbus); // Techem HKV
					} 
					if (wmbus.length >= 24 && wmbus[2] === 0x68 && wmbus[3] === 0x50 && wmbus[9] === 0x04) {
						decoded = TCH_WMZ(wmbus); // Techem WMZ
					} 

					tbody.append(`
						<tr>
							<td>${id}</td>
							<td>${row.timestamp}</td>
							<td>${row.rssi}</td>
							<td>${decoded.manufacturer}</td>
							<td>${decoded.device}</td>
							<td>${decoded.prevDate}</td>
							<td>${decoded.prevHCA}</td>
							<td>${decoded.currDate}</td>
							<td>${decoded.currHCA}</td>
							<td>${decoded.tempRoom}</td>
							<td>${decoded.tempRad}</a></td>
							<td style="text-align: left;"><a href="https://wmbusmeters.org/analyze/${row.wmbus}" target="_blank">${row.wmbus}</a></td>
						</tr>
					`);
				}

				$('#wmbusTable').DataTable({
					pageLength: 25
				});

				document.getElementById('status').textContent = "";

			} catch(err) {
				console.error(err);
				document.getElementById('status').textContent = "Fehler beim Laden der Daten. Prüfe die Verbindung oder CORS-Einstellungen.";
			}
		}

		loadData();

		// Export to Excel
		document.getElementById('exportBtn').addEventListener('click', function() {
			let table = document.getElementById('wmbusTable');
			let wb = XLSX.utils.table_to_book(table, {sheet: "wM-Bus Daten"});
			XLSX.writeFile(wb, 'wmbus_daten.xlsx');
		});

		document.getElementById('updateBtn').addEventListener('click', function() {
			location.reload();
		});

		document.getElementById('snapshotBtn').addEventListener('click', async function() {
			await fetch(`${window.location.pathname.substring(1)}/snapshot`);
		});
	</script>
</body>
</html>
