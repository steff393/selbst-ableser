[Configuration]
Port = COM5          # Alternative: /dev/ttyUSB0 oder /dev/serial/by-id/usb-IMST_iU891A_IMS3015-if00
HttpPort = 8080

# none | daily | monthly
SnapshotMode = daily

# Verzeichnis für JSON-Snapshots
SnapshotDir = snapshots

# JSON-Datei mit Benutzerdaten
Userfile =  users.json

# JSON-Datei mit Zählerplätzen, Zählernummern und AES-Schlüsseln
Locationfile =  locations.json

# Socket-Port, über den das Programm das Passwort annimmt
KeyPort = 53165
