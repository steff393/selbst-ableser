[Configuration]
# Betriebsmodus: local | collector | evaluator
# local     = Alles auf einem Gerät (Windows-Test, Pi mit allem im Haus)
# collector = Sammelt verschlüsselte Telegramme, keine AES-Schlüssel auf diesem Gerät
# evaluator = Empfängt Snapshots, entschlüsselt, stellt Web-UI bereit
Mode = local

# Port des iU891A-XL-Empfängers
Port = auto  # Alternative: COM5 oder /dev/ttyUSB0 oder /dev/serial/by-id/usb-IMST_iU891A_IMS3015-if00

# none | daily | monthly | monthly_safe (daily: täglich um 23 Uhr, monthly: am Monatsletzten, monthly_safe: in den letzten 5 Tagen eines Monats um 23 Uhr)
SnapshotMode = daily

# Verzeichnis für JSON-Snapshots
#SnapshotDir = snapshots
SnapshotDir = tests/snapshots

# JSON-Datei mit Benutzerdaten
Userfile =  users.json

# JSON-Datei mit Zählerplätzen, Zählernummern und AES-Schlüsseln
Locationfile =  locations.json.enc

# Socket-Port, über den das Programm das Passwort annimmt
KeyPortMain  = 53165

# Liste mit Telegrammen, die ignoriert werden sollen (optional)
Blocklistfile = wmbusBlocklist.json

# Ein Zähler gilt als "stumm", wenn er seit so vielen Tagen in keinem Snapshot mehr enthalten war (optional, Standard: 7)
MeterStaleAfterDays = 7

# Backup-Verzeichnis für Snapshots (optional, absoluter Pfad)
BackupDir = /media/usb   # oder F:\

# URL des Servers, an den die Snapshots hochgeladen werden sollen (optional)
#UploadServer=https://mein-server.com

# Token zur Authentifizierung beim Upload-Server (optional, wird nur benötigt, wenn UploadServer angegeben ist)
#UploadToken=ABDC1234EF567890...  