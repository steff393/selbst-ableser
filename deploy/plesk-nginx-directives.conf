# Reverse-proxy configuration for running the evaluator behind Plesk
# (docs/architektur.md, BETRIEB-06 — the operator's current hosting is a VPS
# with Plesk).
#
# Where this goes: Plesk > Websites & Domains > <your domain> >
# Apache & nginx Settings > "Additional nginx directives". Paste the block
# below as-is; Plesk already generates the surrounding server{} block
# (including the TLS certificate, which is what makes this a genuine
# transport-encryption boundary and not just a header rewrite).
#
# The evaluator itself must be started with -trust-proxy (or
# evaluator.trust_proxy: true in config.json) once this is in place —
# without it, X-Forwarded-For is ignored, and every visitor would appear
# to come from 127.0.0.1. Do not set -trust-proxy unless a proxy like this
# one actually sits in front and strips any client-supplied
# X-Forwarded-For first (nginx does this by construction: the directive
# below always appends, it cannot be made to pass a client's value through
# unchanged).
#
# The evaluator also refuses to start with -trust-proxy on unless a
# collector push secret and a Secure session cookie are both configured —
# see docs/install.md's reverse-proxy section for why. And bind it to
# 127.0.0.1:8226 (loopback only, not the default :8226 which binds every
# interface), so the raw HTTP port is never reachable directly, bypassing
# both TLS termination and this proxy.
#
# If pasting this into a Plesk subdomain's "Additional nginx directives"
# fails to save with "duplicate location /": Plesk generates its own
# location / for every (sub)domain, which collides with the one below.
# Turn that subdomain's "Proxy mode" off first (Apache & nginx Settings) —
# that removes Plesk's own location / and frees the root for this block.
# Nothing else about the subdomain's docroot needs to change; it just goes
# unused once every request is proxied here instead.

location / {
    proxy_pass http://127.0.0.1:8226;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The evaluator's own session cookie already carries Secure and
    # HttpOnly; nothing extra is needed here for that.
    proxy_connect_timeout 5s;

    # Match the app's own 10-minute ReadTimeout/WriteTimeout (see
    # cmd/saEvaluator/main.go): archive import, a large readings/archive
    # export, and a backup download are all legitimate operations that can
    # run long, and must not be cut off mid-transfer by the proxy before
    # the app itself is done.
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Archive import accepts up to 200 MiB (maxArchiveImportUpload); a
    # bare default here (Plesk's own default is far smaller) would reject
    # a legitimate upload with 413 before the app ever sees it. A little
    # headroom over 200m for multipart overhead.
    client_max_body_size 210m;
}
