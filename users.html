<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<title>User-Verwaltung</title>
	<style>
		body { font-family: system-ui, sans-serif; padding: 1rem; }
		table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
		th, td { border: 1px solid #ccc; padding: 6px; }
		input { width: 100%; box-sizing: border-box; }
		button { margin: 4px; cursor: pointer; }
		.token { font-family: monospace; background: #eee; padding: 2px 4px; }
	</style>
</head>
<body>

<h1>User-Verwaltung</h1>

<table id="tbl">
	<thead>
		<tr>
			<th>Token</th>
			<th>Wohnung</th>
			<th>Fläche (m²)</th>
			<th>Einzug</th>
			<th>Auszug</th>
			<th>Aktionen</th>
		</tr>
	</thead>
	<tbody></tbody>
</table>

<button onclick="addUser()">➕ Neuer Nutzer</button>
<button onclick="save()">💾 Speichern</button>
<button onclick="exportUsers()">📤 Export</button>

<div id="status" style="margin-top:1rem;"></div>

<script>
let users = {};
// Extrahiere den Admin-Token aus der URL (erster Teil des Pfades)
const adminToken = getAdminToken();
const apiBase = adminToken
	? `/${adminToken}`
	: ""; // Setup-Mode

// Initiales Laden der Daten
fetch(`${apiBase}/users/data`)
	.then(r => {
		if (!r.ok) throw new Error("HTTP " + r.status);
		return r.json();
	})
	.then(data => {
		users = data;
		renderUsers();
	})
	.catch(err => {
		console.error("API error:", err);
		alert("Fehler beim Laden der User-Daten");
	});



function getAdminToken() {
	const parts = window.location.pathname.split("/").filter(Boolean);

	// Erwartete URL im Normalbetrieb:
	// /<token>/users.html
	if (parts.length >= 2 && parts[1].endsWith(".html")) {
		return parts[0];
	}

	return null; // Setup-Mode
}


function renderUsers() {
	const tb = document.querySelector("#tbl tbody");
	tb.innerHTML = "";
	for (const token in users) {
		const u = users[token];
		tb.innerHTML += `
		<tr>
			<td class="token">${token}</td>
			<td><input value="${u?.flat ?? ""}" onchange="updateUser('${token}','flat',this.value)"></td>
			<td>
				<input type="number" step="0.1"
					value="${u?.area ?? 0}"
					onchange="updateUser('${token}','area',parseFloat(this.value) || 0)">
			</td>
			<td><input type="date" value="${u?.move_in ?? ""}" onchange="updateUser('${token}','move_in',this.value)"></td>
			<td><input type="date" value="${u?.move_out ?? ""}" onchange="updateUser('${token}','move_out',this.value)"></td>
			<td>
				<button onclick="openUvi('${token}')">🔗 UVI</button>
				<button onclick="del('${token}')">❌</button>
			</td>
		</tr>`;
	}
}

function updateUser(token, key, val) {
	if (!users[token]) users[token] = {};
	users[token][key] = val || null;
}

function del(token) {
	if(confirm(`Nutzer ${token} wirklich löschen?`)) {
		delete users[token];
		renderUsers();
	}
}

function addUser() {
	const newToken = crypto.getRandomValues(new Uint8Array(8))
		.reduce((s,b)=>s+b.toString(16).padStart(2,"0"),"");
	users[newToken] = { flat: "", area: 0, move_in: null, move_out: null };
	renderUsers();
}

function hasAdmin(users) {
	return Object.values(users).some(u => !u || u.flat == null || u.flat === "");
}

function getAdminTokenFromUsers(users) {
	for (const [token, u] of Object.entries(users)) {
		if (!u || u.flat == null || u.flat === "") {
			return token;
		}
	}
	return null;
}

function save() {
	const status = document.getElementById("status");
	status.textContent = "";

	if (!hasAdmin(users)) {
		status.textContent = "❌ Es muss mindestens ein Admin-Nutzer existieren.";
		status.style.color = "red";
		return;
	}

	fetch(`${apiBase}/users/save`, {
		method: "POST",
		headers: { "Content-Type": "application/json" },
		body: JSON.stringify(users)
	})
	.then(r => {
		if (!r.ok) throw new Error("Speichern fehlgeschlagen");
		return r.json();
	})
	.then(() => {
		const adminToken = getAdminTokenFromUsers(users);

		status.style.color = "green";
		status.innerHTML = `
			✅ Benutzer gespeichert.<br>
			Admin-Token:<br>
			<code style="font-size:1.1em;">${adminToken}</code><br><br>
			Bitte unbedingt notieren/speichern!<br><br>
			<a href="/${adminToken}/index.html">
				👉 Jetzt zur Admin-Oberfläche wechseln
			</a>
		`;
	})
	.catch(err => {
		status.style.color = "red";
		status.textContent = "❌ Fehler beim Speichern";
		console.error(err);
	});
}


function exportUsers() {
	window.location.href = `/${apiBase}/users/export`;
}

function openUvi(token) {
	window.open("/" + token + "/uvi.html", "_blank");
}
</script>

</body>
</html>
